<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="UPI payment page for Tvenkata Subramanian">
<title>Pay via UPI | Tvenkata Subramanian</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #f7f2e8;
  color: #2d241b;
}
.container {
  max-width: 520px;
  margin: 0 auto;
  padding: 24px 16px 40px;
}
.card {
  background: #fff;
  border-radius: 18px;
  padding: 30px 20px;
  text-align: center;
  box-shadow: 0 5px 24px rgba(0,0,0,.12);
}
.symbol { font-size: 40px; margin-bottom: 8px; }
h1 {
  font-size: 26px;
  line-height: 1.3;
  margin: 0 0 14px;
}
.message {
  font-size: 16px;
  line-height: 1.5;
  margin-bottom: 25px;
}
.pay-button {
  display: block;
  width: 100%;
  padding: 17px 12px;
  background: #16803b;
  color: #fff;
  border-radius: 11px;
  font-size: 19px;
  font-weight: bold;
  text-decoration: none;
}
.upi-box {
  margin-top: 25px;
  padding: 16px;
  background: #f1f1f1;
  border-radius: 10px;
}
.upi-label { font-weight: bold; margin-bottom: 8px; }
.upi-id {
  word-break: break-all;
  font-size: 14px;
  line-height: 1.5;
}
.note {
  margin-top: 22px;
  font-size: 13px;
  line-height: 1.5;
  color: #665d53;
}
.footer {
  margin-top: 20px;
  font-size: 12px;
  color: #777;
}
</style>
</head>
<body>

<div class="container">
  <div class="card">
    <div class="symbol">🙏</div>

    <h1>Tvenkata Subramanian</h1>

    <p class="message">
      You can make a payment through UPI.
    </p>

    <!-- Plain HTML UPI deep link. No JavaScript and no optional parameters. -->
    <a
      class="pay-button"
      href="upi://pay?pa=9962896452@upi&amp;pn=Tvenkata%20Subramanian">
      💳 PAY VIA UPI
    </a>

    <div class="upi-box">
      <div class="upi-label">UPI ID</div>
      <div class="upi-id">9962896452@upi</div>
    </div>

    <p class="note">
      Tap “PAY VIA UPI” to open an available UPI application.
      Please verify the recipient name and amount in the UPI app
      before completing the payment.
    </p>

    <div class="footer">
      Thank you.
    </div>
  </div>
</div>

</body>
</html>
