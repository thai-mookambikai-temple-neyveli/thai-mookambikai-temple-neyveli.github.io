<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UPI Intent Test</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  margin: 0;
  padding: 30px 16px;
  text-align: center;
}
.card {
  max-width: 460px;
  margin: 30px auto;
  background: white;
  padding: 28px 20px;
  border-radius: 14px;
  box-shadow: 0 3px 15px rgba(0,0,0,.12);
}
h1 {
  font-size: 24px;
  margin-bottom: 12px;
}
p {
  line-height: 1.5;
}
.pay {
  display: block;
  margin-top: 25px;
  padding: 17px;
  border-radius: 10px;
  background: #16803b;
  color: white;
  text-decoration: none;
  font-size: 19px;
  font-weight: bold;
}
.details {
  margin-top: 25px;
  padding: 12px;
  background: #f0f0f0;
  border-radius: 8px;
  font-size: 14px;
  word-break: break-all;
}
</style>
</head>

<body>
<div class="card">

  <h1>UPI Intent Test</h1>

  <p>
    This is a test payment of <strong>₹100.00</strong>
    to the consumer UPI ID below.
  </p>

  <!--
    Minimal UPI Intent test:
    pa   = payee UPI ID
    pn   = payee name
    am   = exact amount, two decimal places
    cu   = currency
    mode = 04 (Intent)
  -->
  <a
    class="pay"
    href="upi://pay?pa=9962896452@upi&amp;pn=Tvenkata%20Subramanian&amp;am=100.00&amp;cu=INR&amp;mode=04">
    💳 PAY ₹100.00 VIA UPI
  </a>

  <div class="details">
    <strong>UPI ID:</strong><br>
    9962896452@upi<br><br>

    <strong>Amount:</strong> ₹100.00<br>
    <strong>Currency:</strong> INR<br>
    <strong>Mode:</strong> 04 (Intent)
  </div>

</div>
</body>
</html>
